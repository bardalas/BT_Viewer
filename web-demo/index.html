<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BT Viewer – Web Demo</title>
<style>
:root{--bg:#F4F6F9;--card:#fff;--line:#E4E8EE;--ink:#0D1116;--muted:#8A929D;--sky:#E9F2F9;--terr:#C4CAD2;--surf:#78808C;--acc:#175A8A;--alert:#D83628}
body{margin:0;background:#dde2e8;font-family:"Arial Narrow",Arial,sans-serif;display:flex;justify-content:center;padding:20px}
.phone{width:380px;background:var(--bg);border-radius:28px;padding:18px;box-shadow:0 8px 30px #0003}
h1{font-size:22px;margin:4px 0 12px}
.stage{border-radius:18px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:340px}
.read{text-align:center;margin-top:10px;direction:ltr}
.num{font:bold 92px monospace;color:var(--ink)} .unit{color:var(--muted);font-size:16px;font-weight:bold}
.dev{text-align:center;color:var(--muted);font-size:13px;font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
label{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}
input[type=range]{width:100%}
.row{display:flex;gap:8px;margin-top:8px}
button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:16px;font-weight:bold;color:var(--acc);cursor:pointer}
button.on{background:var(--acc);color:#fff}
#snds button{display:block;width:100%;text-align:right;margin-top:6px;font-size:15px}
.alert .num,.alert .unit,.alert .dev{color:#fff}
.alert-bg{background:var(--alert)}
</style></head><body>
<div class="phone" id="phone">
<h1>BT Viewer <small style="color:var(--muted);font-size:13px">(הדגמה)</small></h1>
<div class="stage"><canvas id="cv" width="700" height="680"></canvas></div>
<div class="read"><div class="dev" id="dev">הדגמה</div><div class="num" id="num">–.––</div><div class="unit">מטר</div></div>
<div class="card">
 <div class="row"><button id="bAuto" class="on">אוטומטי</button><button id="bMan">ידני</button><button id="bSnd">🔇 צליל כבוי</button></div>
 <label><span>גובה ידני</span><b id="vMan"></b></label><input id="sMan" type="range" min="3" max="500" value="250">
 <label><span>סף התראה</span><b id="vThr"></b></label><input id="sThr" type="range" min="10" max="200" step="5" value="200">
 <label><span>היסטרזיס</span><b id="vHys"></b></label><input id="sHys" type="range" min="2" max="40" value="8">
 <label><span>צליל התראה</span><b></b></label><div id="snds"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const cfg={thr:200,hyst:8,sound:0}, st={mode:'auto',manual:250,alert:false,target:-1,shown:-1,sound:false};
const RANGE=500, CYCLE=24000, t0=performance.now();
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function profile(ms){const p=(ms%CYCLE)/CYCLE,hi=RANGE*.92,lo=RANGE*.055;
 if(p<.08)return hi; if(p<.42)return lerp(hi,lo,ease((p-.08)/.34)); if(p<.55)return lo;
 if(p<.85)return lerp(lo,hi,ease((p-.55)/.30)); return hi;}
// Alerter.alerting(): enter at threshold, leave at threshold+hysteresis
const alerting=(cm,cur)=>cm<=cfg.thr||(cur&&cm<=cfg.thr+cfg.hyst);
let ac, sp, soundOn = false, want = false, cyc = 0, tph = 0, gn = 0;
const NAMES = ['צליל רצוף','ביפים מהירים','סירנה דו-גונית','יילל עולה','שלושה ביפים'];
const CYC = [1,4,1,3,1], LEVEL = .95, DRIVE = 2.2;
function pat(id, c){ // same patterns as Beeper.java
 switch(id){case 1:return[1000,c<.5];case 2:return[c<.5?650:950,true];case 3:return[700+900*c,true];
  case 4:return[1300,c<.12||(c>=.24&&c<.36)||(c>=.48&&c<.60)];default:return[1000,true];}}
function ensureAudio(){ if(ac){ac.resume();return;}
 ac=new AudioContext(); sp=ac.createScriptProcessor(512,0,1);
 sp.onaudioprocess=e=>{const o=e.outputBuffer.getChannelData(0),sr=ac.sampleRate,step=CYC[cfg.sound]/sr,nrm=Math.tanh(DRIVE);
  for(let i=0;i<o.length;i++){cyc+=step;if(cyc>=1)cyc-=1;const[f,open]=pat(cfg.sound,cyc);
   gn+=((want&&open?LEVEL:0)-gn)*(0.04*22050/sr);tph+=2*Math.PI*f/sr;if(tph>2*Math.PI)tph-=2*Math.PI;
   o[i]=Math.tanh(DRIVE*Math.sin(tph))/nrm*gn*.5;}};   // .5: protect laptop speakers
 sp.connect(ac.destination);}
function audio(on){ensureAudio();want=on;}
let pv; function previewSound(){ensureAudio();want=true;clearTimeout(pv);pv=setTimeout(()=>{want=soundOn&&st.alert},2500);}
const box=$('snds');
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.onclick=()=>{cfg.sound=i;paint();previewSound()};box.appendChild(b)});
function paint(){[...box.children].forEach((b,i)=>b.textContent=(i===cfg.sound?'● ':'○ ')+NAMES[i])}
paint();
// 10 Hz tick, same "312" line path as firmware
setInterval(()=>{let cm=st.mode==='man'?st.manual:profile(performance.now()-t0);
 cm+=(Math.random()*2-1)*1.8; if(cm<3)cm=3; onLine(String(Math.round(cm)));},100);
function onLine(l){const cm=+l; st.target=cm; if(st.shown<0)st.shown=cm;
 st.alert=alerting(cm,st.alert); $('num').textContent=(cm/100).toFixed(2);
 $('phone').classList.toggle('alert',st.alert);
 soundOn=st.sound; if(ac) want=st.sound&&st.alert;}
const cv=$('cv'),g=cv.getContext('2d');
function draw(){const w=cv.width,h=cv.height,s=2,top=20*s,gy=h-34*s,scale=Math.max(50,cfg.thr*2);
 const yF=cm=>gy-(gy-top)*Math.max(0,Math.min(1,cm/scale)), a=st.alert;
 g.clearRect(0,0,w,h);
 g.fillStyle=a?'#DE5043':'#E9F2F9'; g.fillRect(0,0,w,h);
 g.fillStyle='#C4CAD2'; g.fillRect(0,gy,w,h-gy);
 g.strokeStyle='#78808C'; g.lineWidth=3*s; g.beginPath(); g.moveTo(0,gy); g.lineTo(w,gy); g.stroke();
 const ty=yF(cfg.thr); g.strokeStyle=a?'#fff':'#D83628'; g.lineWidth=3*s;
 for(let x=6*s;x<w-6*s;x+=15*s){g.beginPath();g.moveTo(x,ty);g.lineTo(Math.min(x+9*s,w-6*s),ty);g.stroke();}
 if(st.shown>=0){const y=yF(st.shown),cx=w/2,wing=36*s,bar=6*s,body=13*s;
  g.fillStyle=a?'#fff':'#0D1116';
  g.fillRect(cx-wing-body/2,y-bar/2,wing,bar); g.fillRect(cx+body/2,y-bar/2,wing,bar); g.fillRect(cx-body/2,y-5*s,body,10*s);
  const d=st.target-st.shown; st.shown=Math.abs(d)>.15?st.shown+d*(Math.abs(d)>20?.6:.3):st.target;}
 requestAnimationFrame(draw);}
draw();
function bind(id,vid,fn,fmt){const e=$(id),v=$(vid);const u=()=>{fn(+e.value);v.textContent=fmt(+e.value)};e.oninput=u;u();}
bind('sMan','vMan',v=>st.manual=v,v=>(v/100).toFixed(2)+' מ׳');
bind('sThr','vThr',v=>cfg.thr=v,v=>(+(v/100).toFixed(2))+' מ׳');
bind('sHys','vHys',v=>cfg.hyst=v,v=>v+' ס״מ');
$('bAuto').onclick=()=>{st.mode='auto';$('bAuto').classList.add('on');$('bMan').classList.remove('on')};
$('bMan').onclick=()=>{st.mode='man';$('bMan').classList.add('on');$('bAuto').classList.remove('on')};
$('bSnd').onclick=e=>{st.sound=!st.sound;soundOn=st.sound;if(st.sound)ensureAudio();want=st.sound&&st.alert;e.target.textContent=st.sound?'🔊 צליל פועל':'🔇 צליל כבוי';e.target.classList.toggle('on',st.sound)};
</script></body></html>
